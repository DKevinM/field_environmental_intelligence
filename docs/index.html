<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field Conditions Report</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;background:#0f1720;color:#f4f7fa;font-family:Arial}
header{max-width:1100px;margin:auto;padding:20px}
#map{height:80vh;width:100%}
button{background:#4dabf7;color:#0f1720;border:none;padding:10px 16px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{background:#304152;color:#9fb0bf}
.hint{color:#9fb0bf;font-size:14px}
</style></head><body>
<header><h1>Field Conditions Report</h1><p class="hint">Click anywhere on the map, or use your current location, to get a live report for that spot.</p><button id="locbtn" onclick="useMyLocation()">Use my current location</button></header>
<div id="map"></div>
<script>
// Backend that actually generates the report. Update this once the
// backend has a stable public host/port (see field_environmental_intelligence/README.md).
var BACKEND_URL='http://207.126.161.96:8811';

var map=L.map('map').setView([53.05,-114.2],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors &copy; CARTO',maxZoom:19}).addTo(map);
map.on('click',function(e){goTo(e.latlng.lat,e.latlng.lng);});
function goTo(lat,lon){window.location.href=BACKEND_URL+'/report?lat='+lat.toFixed(5)+'&lon='+lon.toFixed(5);}
function useMyLocation(){
  var btn=document.getElementById('locbtn');
  if(!navigator.geolocation){alert('Geolocation is not available on this device/browser.');return;}
  btn.disabled=true;btn.textContent='Locating...';
  navigator.geolocation.getCurrentPosition(
    function(pos){goTo(pos.coords.latitude,pos.coords.longitude);},
    function(err){btn.disabled=false;btn.textContent='Use my current location';alert('Could not get your location: '+err.message);},
    {enableHighAccuracy:true,timeout:10000}
  );
}
</script>
</body></html>
